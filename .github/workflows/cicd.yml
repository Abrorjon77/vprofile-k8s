name: Vprofile CI/CD

on:
  push:
    branches:
      - main

jobs:

  # ─── JOB 1: TEST ────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Run tests
        run: mvn test
        working-directory: vprofile-k8s

  # ─── JOB 2: BUILD & PUSH DOCKER IMAGES ──────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            abroor/vprofileapp:${{ github.sha }}
            abroor/vprofileapp:latest

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: |
            abroor/vprofileweb:${{ github.sha }}
            abroor/vprofileweb:latest

  # ─── JOB 3: UPDATE HELM VALUES & TRIGGER ARGOCD ─────────────────────────────
  deploy:
    name: Update Helm values.yaml
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tags in values.yaml
        run: |
          yq e ".app.image = \"abroor/vprofileapp:${{ github.sha }}\"" -i vprofile-k8s/helm/vprofile/values.yaml
          yq e ".web.image = \"abroor/vprofileweb:${{ github.sha }}\"" -i vprofile-k8s/helm/vprofile/values.yaml

      - name: Commit and push updated values.yaml
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add vprofile-k8s/helm/vprofile/values.yaml
          git commit -m "ci: update image tags to ${{ github.sha }} [skip ci]"
          git push
