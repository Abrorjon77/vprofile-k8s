apiVersion: apps/v1
kind: Deployment
metadata:
  name: vproapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vproapp
  template:
    metadata:
      labels:
        app: vproapp
    spec:
      containers:
        - name: vproapp
          image: abroor/vprofileapp:latest
          ports:
            - containerPort: 8080
