# Prometheus configuration for vprofile stack monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # vprofile app (Spring Boot Actuator)
  - job_name: 'vprofileapp'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['vproapp:8080']

  # Nginx web frontend
  - job_name: 'vproweb'
    static_configs:
      - targets: ['vproweb:9113']

  # MySQL database
  - job_name: 'vprodb'
    static_configs:
      - targets: ['vprodb:9104']

  # RabbitMQ
  - job_name: 'vpromq'
    static_configs:
      - targets: ['vpromq01:15692']

  # Memcached
  - job_name: 'vprocache'
    static_configs:
      - targets: ['vprocache01:9150']

  # Kubernetes nodes (if running on K8s)
  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
