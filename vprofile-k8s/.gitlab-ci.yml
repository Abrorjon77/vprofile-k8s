stages:
  - test
  - build
  - push
  - deploy

variables:
  DOCKER_REGISTRY: docker.io
  APP_IMAGE: abroor/vprofileapp
  WEB_IMAGE: abroor/vprofileweb
  DB_IMAGE: abroor/vprofiledb
  HELM_CHART_PATH: vprofile-k8s/helm/vprofile

# ─── STAGE 1: TEST ───────────────────────────────────────────────────────────

test:
  stage: test
  image: maven:3.8-openjdk-11
  script:
    - echo "Running unit tests..."
    - mvn test
  only:
    - merge_requests
    - main
    - master

# ─── STAGE 2: BUILD DOCKER IMAGES ────────────────────────────────────────────

build-app:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
  script:
    - docker build -t $APP_IMAGE:$CI_COMMIT_SHORT_SHA -t $APP_IMAGE:latest ./app
  only:
    - main
    - master

build-web:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
  script:
    - docker build -t $WEB_IMAGE:$CI_COMMIT_SHORT_SHA -t $WEB_IMAGE:latest ./web
  only:
    - main
    - master

# ─── STAGE 3: PUSH TO DOCKER HUB ─────────────────────────────────────────────

push-app:
  stage: push
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
  script:
    - docker push $APP_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $APP_IMAGE:latest
  only:
    - main
    - master

push-web:
  stage: push
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
  script:
    - docker push $WEB_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $WEB_IMAGE:latest
  only:
    - main
    - master

# ─── STAGE 4: UPDATE HELM VALUES & TRIGGER ARGOCD ───────────────────────────

deploy:
  stage: deploy
  image: alpine:3.18
  before_script:
    - apk add --no-cache curl git
    # Install yq to edit values.yaml
    - curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
    - chmod +x /usr/local/bin/yq
  script:
    # Update image tags in values.yaml with the new commit SHA
    - yq e ".app.image = \"$APP_IMAGE:$CI_COMMIT_SHORT_SHA\"" -i $HELM_CHART_PATH/values.yaml
    - yq e ".web.image = \"$WEB_IMAGE:$CI_COMMIT_SHORT_SHA\"" -i $HELM_CHART_PATH/values.yaml

    # Commit and push updated values.yaml back to repo
    - git config user.email "gitlab-ci@vprofile.com"
    - git config user.name "GitLab CI"
    - git add $HELM_CHART_PATH/values.yaml
    - git commit -m "ci: update image tags to $CI_COMMIT_SHORT_SHA [skip ci]"
    - git push https://oauth2:$GITLAB_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git HEAD:$CI_COMMIT_BRANCH
  only:
    - main
    - master
