---
# ────────────────────────────────
# NGINX FRONTEND
# ────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vproweb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vproweb
  template:
    metadata:
      labels:
        app: vproweb
    spec:
      containers:
        - name: vproweb
          image: your-dockerhub-username/vprofileweb:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: vproweb
spec:
  selector:
    app: vproweb
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080